<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>彥甫&amp;馨云 婚禮邀請函</title>
  <link rel="icon" href="data:,">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow-x: hidden;
    }

    .video-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      background-color: #000; /* 兩側或上下多餘區域的底色 */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      aspect-ratio: 720 / 1280;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain; /* 確保影片完全容納在比例框內 */
      display: block;
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88px;
      height: 88px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .play-button:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .play-button svg {
      width: 34px;
      height: 34px;
      margin-left: 4px;
      fill: #ffffff;
    }

    .play-button.hidden {
      display: none;
    }
  </style>
  <script>
    (function () {
      const url = new URL(window.location.href);
      const RELOAD_PARAM = '_r';

      // 如果網址尚未帶有重新導向標記
      if (!url.searchParams.has(RELOAD_PARAM)) {
        url.searchParams.set(RELOAD_PARAM, '1');
        
        // 使用 replace 避免在 History 堆疊中產生多餘紀錄
        window.location.replace(url.toString());
      }
    })();
  </script>
</head>

<body>
  <div class="video-wrap">
    <video id="invitation-video" src="invitation-video.mp4" playsinline oncontextmenu="return false"></video>
    <button id="play-button" class="play-button" aria-label="播放影片">
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
    </button>
  </div>

  <script>
    const video = document.getElementById('invitation-video');
    const playButton = document.getElementById('play-button');

    const REDIRECT_AT_SECONDS = 26;
    const REDIRECT_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSc4AOmS4MWbKJNeR79BI-hm7OtHDJ6fmzoslPhsOlYvWZjhzw/viewform';
    playButton.addEventListener('click', playVideo);

    video.addEventListener('click', () => {
      if (video.ended || video.currentTime >= REDIRECT_AT_SECONDS) {
        window.open(REDIRECT_URL, '_self');
      } else if (video.paused) {
        playVideo();
      } else {
        pauseVideo();
      }
    });

    function playVideo() {
      video.play();
      playButton.classList.add('hidden');
    }

    function pauseVideo() {
      video.pause();
      playButton.classList.remove('hidden');
    }
  </script>
</body>

</html>
